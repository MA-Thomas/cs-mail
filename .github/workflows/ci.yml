name: ci

on:
  push:
  pull_request:

env:
  IDENTITY_MODEL_REF: ${{ vars.IDENTITY_MODEL_REF }}

defaults:
  run:
    working-directory: cs-mail

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cs-mail
      - name: Require reviewed identity contract revision
        run: |
          if [[ ! "$IDENTITY_MODEL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Set IDENTITY_MODEL_REF to the reviewed identity-model commit containing identity-contract and identity-enrollment."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: MA-Thomas/identity-model
          ref: ${{ env.IDENTITY_MODEL_REF }}
          path: identity-model
      - name: Verify reviewed identity source contents
        run: sha256sum --check identity-source.sha256
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cs-mail
      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cs_mail
          POSTGRES_PASSWORD: cs_mail
          POSTGRES_DB: cs_mail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs_mail -d cs_mail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CS_MAIL_TEST_DATABASE_URL: postgres://cs_mail:cs_mail@localhost:5432/cs_mail_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: cs-mail
      - name: Require reviewed identity contract revision
        run: |
          if [[ ! "$IDENTITY_MODEL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Set IDENTITY_MODEL_REF to the reviewed identity-model commit containing identity-contract and identity-enrollment."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: MA-Thomas/identity-model
          ref: ${{ env.IDENTITY_MODEL_REF }}
          path: identity-model
      - name: Verify reviewed identity source contents
        run: sha256sum --check identity-source.sha256
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cs-mail
      - run: cargo test --workspace -- --ignored

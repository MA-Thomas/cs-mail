[package]
name = "cs-mail-smtp-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
cs-mail-accounts = { path = "../cs-mail-accounts" }
cs-mail-content = { path = "../cs-mail-content" }
hmac.workspace = true
getrandom = "0.2"
base64 = "0.22"
subtle = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
cs-mail-guests = { path = "../cs-mail-guests" }
cs-mail-correspondence = { path = "../cs-mail-correspondence" }
mail-parser = "=0.11.8"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
cs-mail-adapters = { path = "../cs-mail-adapters" }
cs-mail-primitives = { path = "../cs-mail-primitives" }
ring = "0.17"
rustls-pki-types = "1"
mail-auth.workspace = true

[lints]
workspace = true

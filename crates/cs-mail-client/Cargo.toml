[package]
name = "cs-mail-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
cs-mail-search = { path = "../cs-mail-search" }
cs-mail-wire = { path = "../cs-mail-wire" }
cs-mail-adapters = { path = "../cs-mail-adapters" }
cs-mail-guests = { path = "../cs-mail-guests" }
cs-mail-capabilities = { path = "../cs-mail-capabilities" }
cs-mail-privacy = { path = "../cs-mail-privacy" }
cs-mail-correspondence = { path = "../cs-mail-correspondence" }
cs-mail-application = { path = "../cs-mail-application" }
serde_json.workspace = true
getrandom = "0.4.3"
cs-mail-finance = { path = "../cs-mail-finance" }
cs-mail-billing = { path = "../cs-mail-billing" }
cs-mail-content = { path = "../cs-mail-content" }
cs-mail-primitives = { path = "../cs-mail-primitives" }
cs-mail-protocol = { path = "../cs-mail-protocol" }
cs-mail-security = { path = "../cs-mail-security" }
serde.workspace = true
identity-contract.workspace = true
cs-mail-accounts = { path = "../cs-mail-accounts" }
ed25519-dalek.workspace = true
base64 = "0.22"
sha2.workspace = true
hmac.workspace = true
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = { version = "0.11", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[features]
member-runtime = ["dep:chacha20poly1305", "dep:reqwest"]

[lints]
workspace = true

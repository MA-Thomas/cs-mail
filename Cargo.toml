[workspace]
members = [
    "crates/cs-mail-billing",
    "crates/cs-mail-finance",
    "crates/cs-mail-primitives",
    "crates/cs-mail-ledger",
    "crates/cs-mail-protocol",
    "crates/cs-mail-application",
    "crates/cs-mail-storage-postgres",
    "crates/cs-mail-wire",
    "crates/cs-mail-security",
    "crates/cs-mail-content",
    "crates/cs-mail-worker",
    "crates/cs-mail-service",
    "crates/cs-mail-client",
    "crates/cs-mail-privacy",
    "crates/cs-mail-adapters",
    "crates/cs-mail-capabilities",
    "crates/cs-mail-smtp-gateway",
    "crates/cs-mail-conformance",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
postgres = { version = "0.19.10", features = ["with-serde_json-1"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
ed25519-dalek = "3.0.0"
minicbor = { version = "2.3.0", features = ["std"] }
sha2 = "0.11.0"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
hmac = "0.13.0"
mail-auth = { version = "=0.12.1", default-features = false, features = ["ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

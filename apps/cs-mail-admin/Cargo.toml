[package]
name = "cs-mail-admin"
description = "cs-mail operator CLI: keys and signed operator commands over the service API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Development only: signed scenario commands for the durable payment simulator.
simulation = ["dep:cs-mail-simulation"]

[dependencies]
clap.workspace = true
cs-mail-operations = { path = "../../crates/cs-mail-operations" }
cs-mail-primitives = { path = "../../crates/cs-mail-primitives" }
cs-mail-simulation = { path = "../../crates/cs-mail-simulation", optional = true }
ed25519-dalek.workspace = true
getrandom = "0.2"
identity-contract.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
